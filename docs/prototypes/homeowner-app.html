<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home AI · Unit 12, Reef House</title>
<style>
:root{
  --ink:#182230;
  --ink-2:rgba(24,34,48,0.62);
  --ink-3:rgba(24,34,48,0.4);
  --glass:rgba(255,255,255,0.58);
  --glass-strong:rgba(255,255,255,0.78);
  --glass-line:rgba(255,255,255,0.85);
  --teal:#0e7d78;
  --teal-soft:rgba(14,125,120,0.13);
  --coral:#c04a32;
  --coral-soft:rgba(192,74,50,0.13);
  --amber:#9a6413;
  --amber-soft:rgba(154,100,19,0.15);
  --green:#2f7040;
  --green-soft:rgba(47,112,64,0.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Avenir Next","SF Pro Text","Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  padding:18px;
  background:
    radial-gradient(900px 600px at 8% -5%, rgba(64,190,220,0.32), transparent 60%),
    radial-gradient(800px 640px at 96% 12%, rgba(255,166,120,0.30), transparent 62%),
    radial-gradient(900px 700px at 50% 108%, rgba(120,205,170,0.32), transparent 60%),
    radial-gradient(600px 500px at 78% 78%, rgba(190,160,255,0.20), transparent 65%),
    linear-gradient(180deg,#f7fbfd,#eef4f6);
  background-attachment:fixed;
}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block}
#app{
  position:relative;width:100%;max-width:400px;height:min(780px,calc(100vh - 36px));
  border-radius:34px;overflow:hidden;
  background:var(--glass);
  backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);
  border:1px solid var(--glass-line);
  box-shadow:0 1px 1px rgba(255,255,255,0.9) inset,0 20px 60px rgba(24,34,48,0.14);
  display:flex;flex-direction:column;
}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(480px 260px at 85% -8%, rgba(255,255,255,0.5), transparent 60%);z-index:0}
.topbar{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px}
.topbar b{font-size:14px;font-weight:600}
.views{position:relative;flex:1;overflow:hidden;z-index:1}
.view{position:absolute;inset:0;overflow-y:auto;padding:6px 16px 96px;display:none}
.view.on{display:block}
.gcard{background:var(--glass-strong);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--glass-line);border-radius:16px;box-shadow:0 1px 1px rgba(255,255,255,0.85) inset,0 3px 14px rgba(24,34,48,0.05)}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:11px;line-height:1.4;padding:5px 12px;border-radius:999px;white-space:nowrap;font-weight:600;border:1px solid rgba(255,255,255,0.7)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.info{background:var(--teal-soft);color:var(--teal)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.mute{background:rgba(255,255,255,0.6);color:var(--ink-2)}
.card-line{display:flex;align-items:center;gap:11px;padding:12px 13px;margin-bottom:9px}
.card-line .ic{flex-shrink:0;width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;background:rgba(255,255,255,0.7);border:1px solid var(--glass-line);color:var(--ink-2)}
.card-line .tx{flex:1;min-width:0}
.card-line .tx b{display:block;font-size:12.5px;font-weight:600}
.card-line .tx span{display:block;font-size:11px;color:var(--ink-2);margin-top:2px}
.card-line.danger{background:linear-gradient(135deg,rgba(192,74,50,0.14),rgba(255,166,120,0.16))}
.card-line.danger .tx b,.card-line.danger .tx span{color:var(--coral)}
.card-line.danger .ic{color:var(--coral)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 15px;border-radius:14px;border:1px solid var(--glass-line);background:var(--glass-strong);font-size:12.5px;font-weight:600;font-family:inherit;color:var(--ink);cursor:pointer;box-shadow:0 1px 1px rgba(255,255,255,0.9) inset,0 3px 10px rgba(24,34,48,0.06)}
.btn .bic{flex-shrink:0;width:18px;display:flex;align-items:center;justify-content:center;font-size:14px}
.btn.primary{background:linear-gradient(135deg,#12938d,#0b6d68);border-color:rgba(255,255,255,0.4);color:#fff;box-shadow:0 1px 1px rgba(255,255,255,0.35) inset,0 6px 18px rgba(14,125,120,0.35)}
.btn.ghost{background:rgba(255,255,255,0.4);color:var(--ink-2);box-shadow:none}
.btn.listy{justify-content:flex-start;text-align:left;width:100%}
.btn:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.btn:active{transform:translateY(1px)}
.hint{font-size:10.5px;color:var(--ink-3);text-align:center;margin-top:7px}
.section-label{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin:16px 4px 8px}
/* chat */
.nudges{display:flex;gap:7px;overflow-x:auto;margin:4px 0 12px;scrollbar-width:none}
.nudges::-webkit-scrollbar{display:none}
.bubble{font-size:12.5px;line-height:1.55;padding:10px 13px;max-width:86%;margin-bottom:9px}
.bubble.me{background:linear-gradient(135deg,rgba(14,125,120,0.16),rgba(64,190,220,0.18));color:#0a5f5b;border:1px solid rgba(255,255,255,0.7);border-radius:15px 15px 4px 15px;margin-left:auto;font-weight:500}
.bubble.home{background:rgba(255,255,255,0.72);color:var(--ink-2);border:1px solid var(--glass-line);border-radius:15px 15px 15px 4px}
.chatinput{position:absolute;left:14px;right:14px;bottom:78px;display:flex;align-items:center;gap:9px;border:1px solid var(--glass-line);background:rgba(255,255,255,0.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:8px 10px 8px 16px;box-shadow:0 1px 1px rgba(255,255,255,0.9) inset,0 6px 18px rgba(24,34,48,0.10);z-index:3;color:var(--ink-3);font-size:14px}
.chatinput input{flex:1;border:none;background:transparent;font-family:inherit;font-size:13px;color:var(--ink);outline:none}
.chatinput button{border:none;background:linear-gradient(135deg,#12938d,#0b6d68);color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px}
.suggest{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
.suggest button{border:1px solid var(--glass-line);background:rgba(255,255,255,0.6);border-radius:999px;padding:6px 12px;font-size:11px;font-family:inherit;color:var(--teal);font-weight:600;cursor:pointer}
/* tabbar */
.tabbar{position:absolute;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-around;align-items:center;padding:10px 8px;border-radius:999px;background:rgba(255,255,255,0.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-line);box-shadow:0 1px 1px rgba(255,255,255,0.9) inset,0 8px 22px rgba(24,34,48,0.12);z-index:4}
.tab{text-align:center;color:var(--ink-3);font-size:9.5px;font-weight:600;background:none;border:none;font-family:inherit;cursor:pointer;padding:2px 10px}
.tab .ic{font-size:17px;display:flex;justify-content:center;margin-bottom:3px}
.tab.on{color:var(--teal)}
/* issues */
.issue{padding:11px 13px;margin-bottom:9px}
.issue .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.issue .top b{font-size:12.5px;font-weight:600;min-width:0}
.issue span.sub{display:block;font-size:11px;color:var(--ink-2);margin-top:4px}
.src{font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--teal);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.tile{padding:12px 8px;text-align:center;color:var(--ink-2);cursor:pointer}
.tile .ic{font-size:17px;display:flex;justify-content:center}
.tile p{font-size:11px;margin-top:6px;font-weight:600;color:var(--ink)}
/* tour */
.orb{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--teal);margin:22px auto 12px;background:linear-gradient(135deg,rgba(64,190,220,0.35),rgba(120,205,170,0.35));border:1px solid var(--glass-line);box-shadow:0 1px 1px rgba(255,255,255,0.9) inset,0 8px 22px rgba(14,125,120,0.22)}
.chapter{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-size:12px;color:var(--ink-2);background:rgba(255,255,255,0.55);border:1px solid rgba(255,255,255,0.75);margin-bottom:7px;cursor:pointer}
.chapter .cnum{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,0.75);color:var(--ink-2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.chapter.on{background:var(--teal-soft);border-color:rgba(255,255,255,0.9)}
.chapter.on .cnum{background:var(--teal);color:#fff}
.chapter.done .cnum{background:var(--green-soft);color:var(--green)}
.chapter .ct{flex:1;font-weight:500;color:var(--ink)}
.chapter .cd{font-size:10px;color:var(--ink-3)}
/* map */
#mapwrap{position:relative;margin-bottom:10px}
#floor{width:100%;height:auto;display:block;border-radius:16px}
.dot{cursor:pointer}
.dot circle.core{fill:#fff;stroke-width:2}
.dot circle.ring{fill:none;stroke-width:2;opacity:0.5}
@media (prefers-reduced-motion:no-preference){
  .dot circle.ring{animation:pulse 2.2s ease-out infinite}
  @keyframes pulse{0%{r:7;opacity:0.55}70%{r:15;opacity:0}100%{r:15;opacity:0}}
}
.sheet{position:absolute;left:12px;right:12px;bottom:88px;z-index:5;padding:13px 14px;border-radius:18px;background:rgba(255,255,255,0.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--glass-line);box-shadow:0 12px 34px rgba(24,34,48,0.18);display:none}
.sheet.on{display:block}
.sheet b{font-size:13px;font-weight:600;display:block}
.sheet p{font-size:11.5px;color:var(--ink-2);line-height:1.55;margin-top:4px}
.sheet .close{position:absolute;top:9px;right:11px;border:none;background:none;font-size:14px;color:var(--ink-3);cursor:pointer;font-family:inherit}
/* triage */
.assess-step{display:flex;align-items:center;gap:10px;padding:6px 2px;font-size:12px;color:var(--ink-2);opacity:0;transition:opacity .35s}
.assess-step.on{opacity:1}
.assess-step .st{flex-shrink:0;width:18px;display:flex;align-items:center;justify-content:center}
.spin{width:13px;height:13px;border:2px solid var(--teal-soft);border-top-color:var(--teal);border-radius:50%}
@media (prefers-reduced-motion:no-preference){.spin{animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}}
.photobox{border:1.5px dashed rgba(24,34,48,0.25);border-radius:14px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-2);font-size:12px;cursor:pointer;background:rgba(255,255,255,0.45)}
.back{display:inline-flex;align-items:center;gap:6px;border:none;background:none;font-family:inherit;font-size:12px;font-weight:600;color:var(--teal);cursor:pointer;padding:6px 2px;margin-bottom:4px}
.fade{animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
</head>

<script>
const V = document.getElementById('views');
const ic = n => `<svg class="i"><use href="#i-${n}"/></svg>`;

/* ---------- data ---------- */
const dots = [
  {id:'water', x:118, y:210, c:'#c04a32', t:'Water shut-off', d:'In the laundry cupboard, low on the left wall. Turn the lever a quarter-turn clockwise to close. Shuts water to the whole unit.'},
  {id:'board', x:318, y:96,  c:'#c04a32', t:'Switchboard', d:'Hallway cupboard beside the entry. Safety switches are labelled. If power trips, reset the middle switch first.'},
  {id:'hws',   x:322, y:212, c:'#0e7d78', t:'Hot water system', d:'Rheem 491, balcony service cupboard. Warranty until Aug 2031. Isolation tap is on the cold inlet, right side.'},
  {id:'nbn',   x:236, y:96,  c:'#0e7d78', t:'NBN connection', d:'Fibre wall outlet in the study nook. The building runs FTTP. Router power point is directly below.'},
  {id:'exit',  x:52,  y:96,  c:'#9a6413', t:'Fire exit: stair B', d:'Out the front door, turn left, 8 metres. Never use the lift in a fire. Assembly point is the Reef St forecourt.'}
];

const tourChapters = [
  {t:'Welcome from Sunrise', d:'0:25', cap:'"Welcome to Unit 12, Reef House. I\'m your apartment\'s guide, built by Sunrise Developments. This takes about four minutes."'},
  {t:'Shut-offs and fire exits', d:'0:45', cap:'"Your water shut-off is in the laundry cupboard, low on the left. Your fire exit is stair B, left of your front door. Let\'s look at both on your plan."', danger:true},
  {t:'Your appliances', d:'1:05', cap:'"Your Bosch dishwasher\'s eco cycle runs over three hours. That\'s normal. Your split system filters want a clean each quarter, and I\'ll remind you."'},
  {t:'Your building', d:'0:50', cap:'"The recycling room is on B1, collections Monday. Visitor parking is bays 1 to 6. The pool runs 6am to 9pm and your fob opens the gate."'},
  {t:'Warranties at a glance', d:'0:35', cap:'"Your 12-month defect period ends 2 June 2027. Each appliance carries its own warranty, and I track every one of them."'},
  {t:'Just ask me anything', d:'0:20', cap:'"That\'s the tour. From here, just ask: where do visitors park? Or snap a photo of anything that worries you."'}
];

const chatReplies = [
  {k:['park','visitor'], r:'Visitor bays 1 to 6 are on basement level 1, just left of the roller door. Book through your guest code and they get 4 hours.'},

const tabs=[...document.querySelectorAll('.tab')];
function show(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  document.getElementById('v-'+v).classList.add('on');
  tabs.forEach(t=>t.classList.toggle('on',t.dataset.v===v));
  chatBar.style.display = v==='chat'?'flex':'none';
  if(v==='map') buildDots();
  if(v==='tour') renderTour();
  if(v==='triage') triGo('capture');
}
tabs.forEach(t=>t.addEventListener('click',()=>show(t.dataset.v)));

/* ---------- chat ---------- */
function addBubble(txt,who){
  const log=document.getElementById('chatlog');
  const b=document.createElement('div');b.className='bubble '+who+' fade';b.textContent=txt;
  log.appendChild(b);
  document.getElementById('v-chat').scrollTop=1e6;
}
function reply(q){
  const low=q.toLowerCase();
  const hit=chatReplies.find(r=>r.k.some(k=>low.includes(k)));
  setTimeout(()=>addBubble(hit?hit.r:chatFallback,'home'),650);
}
function sendChat(){
  const inp=document.getElementById('chatin');
  const q=inp.value.trim();if(!q)return;
  addBubble(q,'me');inp.value='';reply(q);
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.activeElement.id==='chatin')sendChat()});
document.getElementById('suggests').addEventListener('click',e=>{
  const q=e.target.dataset.q;if(!q)return;
  addBubble(q,'me');reply(q);
});

/* ---------- dates task ---------- */
document.getElementById('taskAC').addEventListener('click',function(){
  if(this.dataset.done==='1')return;
  this.dataset.done='1';
  document.getElementById('taskACbox').innerHTML='<svg class="i" style="width:13px;height:13px"><use href="#i-check"/></svg>';
  document.getElementById('taskACsub').textContent='Done. Rescheduled for October.';
});

/* ---------- map ---------- */
function buildDots(){
  const layer=document.getElementById('dotlayer');
  if(layer.childElementCount)return;
  dots.forEach(d=>{
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','dot');g.setAttribute('tabindex','0');g.setAttribute('role','button');g.setAttribute('aria-label',d.t);
    g.innerHTML=`<circle class="ring" cx="${d.x}" cy="${d.y}" r="7" stroke="${d.c}"/><circle class="core" cx="${d.x}" cy="${d.y}" r="6" stroke="${d.c}"/>`;
    const open=()=>{document.getElementById('sheetT').textContent=d.t;document.getElementById('sheetD').textContent=d.d;document.getElementById('sheet').classList.add('on')};
    g.addEventListener('click',open);
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')open()});
    layer.appendChild(g);
  });
}
function openMap(focus){show('map');if(focus){const d=dots.find(x=>x.id===focus);if(d){setTimeout(()=>{document.getElementById('sheetT').textContent=d.t;document.getElementById('sheetD').textContent=d.d;document.getElementById('sheet').classList.add('on')},250)}}}
function closeSheet(){document.getElementById('sheet').classList.remove('on')}

/* ---------- tour ---------- */
let tourAt=1;
function renderTour(){
  const list=document.getElementById('tourList');
  list.innerHTML=tourChapters.map((c,i)=>`
    <div class="chapter ${i<tourAt?'done':''} ${i===tourAt?'on':''}" onclick="tourTo(${i})">
      <span class="cnum">${i<tourAt?'<svg class="i" style="width:11px;height:11px"><use href="#i-check"/></svg>':i+1}</span>
      <span class="ct" ${c.danger?'style="color:var(--coral)"':''}>${c.t}</span><span class="cd">${c.d}</span>
    </div>`).join('');
  document.getElementById('tourCap').textContent=tourChapters[tourAt].cap;
  document.getElementById('tourBtn').innerHTML= tourAt>=tourChapters.length-1
    ? '<span class="bic"><svg class="i"><use href="#i-chat"/></svg></span>Start chatting'
    : '<span class="bic"><svg class="i"><use href="#i-play"/></svg></span>Next chapter';
}
function tourTo(i){tourAt=i;renderTour()}
function tourNext(){ if(tourAt>=tourChapters.length-1){show('chat');return} tourAt++;renderTour() }

  if(step==='card'){tri().innerHTML=`
    <div class="gcard fade" style="padding:13px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;color:var(--teal)">${ic('home')}<b style="font-size:12.5px;color:var(--ink)">What I can see</b></div>
      <p style="font-size:12px;color:var(--ink-2);line-height:1.6;margin-bottom:10px">A hairline gap where the skirting meets the wall. Common settling in a building\'s first year, not a structural concern.</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill mute">Cosmetic</span><span class="pill info">12-month defect period</span></div>
    </div>
    <div class="gcard" style="padding:13px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;color:var(--green)">${ic('check')}<b style="font-size:12.5px;color:var(--ink)">Nothing to worry about</b></div>
      <p style="font-size:12px;color:var(--ink-2);line-height:1.6;margin-bottom:10px">This will close up as the building settles. A bead of flexible gap filler fixes it in 10 minutes. Here\'s how.</p>
      <div style="display:flex;flex-direction:column;gap:7px">
        <button class="btn listy"><span class="bic">${ic('list')}</span>Show me the steps</button>
        <button class="btn listy"><span class="bic">${ic('camera')}</span>Watch it: start a photo log</button>
        <button class="btn listy"><span class="bic">${ic('calendar')}</span>Remind me in 3 months</button>
      </div>
      <div style="border-top:1px solid rgba(24,34,48,0.08);margin-top:11px;padding-top:10px">
        <button class="btn ghost" style="width:100%" onclick="triGo('report')">Report to Sunrise Developments anyway</button>
        <p class="hint">Always your call. Reporting is never blocked</p>
      </div>
    </div>`;}
  if(step==='report'){tri().innerHTML=`
    <p style="font-size:14px;font-weight:600;margin:2px 2px 10px">Report to Sunrise Developments</p>
    <div class="gcard" style="padding:13px;font-size:12px;display:flex;flex-direction:column;gap:9px">
      <div><p style="font-size:10px;color:var(--ink-3)">Issue</p><p>Skirting gap, hallway near linen press</p></div>
      <div><p style="font-size:10px;color:var(--ink-3)">Location</p><p>Hallway · tapped on home map</p></div>
      <div><p style="font-size:10px;color:var(--ink-3)">Photos</p><div style="display:flex;gap:7px;margin-top:4px"><div class="gcard" style="width:38px;height:38px"></div><div class="gcard" style="width:38px;height:38px"></div></div></div>
      <div><p style="font-size:10px;color:var(--ink-3)">Warranty status</p><p>In 12-month defect period</p></div>
    </div>
    <p style="font-size:11px;color:var(--ink-2);margin:9px 2px">Everything\'s editable. Tap any field to change it before sending.</p>
    <button class="btn primary" style="width:100%" onclick="triGo('sent')">Send report</button>
    <p class="hint">You\'ll see its status in Issues, every step</p>`;}
  if(step==='sent'){tri().innerHTML=`
    <div class="orb" style="color:var(--green);background:linear-gradient(135deg,rgba(120,205,170,0.35),rgba(64,190,220,0.3))">${ic('check')}</div>
    <p style="font-size:15px;font-weight:600;text-align:center">Sent to Sunrise</p>
    <p style="font-size:12px;color:var(--ink-2);text-align:center;line-height:1.6;margin:6px 12px 14px">Logged 4:12pm with your photos and the assessment. Sunrise typically responds within 5 business days, and I\'ll nudge you the moment anything changes.</p>

}
